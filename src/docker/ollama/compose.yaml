name: experimental-ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_api
    restart: unless-stopped
    environment:
      # Vulkan is on by default in current images; the iGPU must be opted into
      # explicitly or Ollama drops it during device discovery.
      OLLAMA_IGPU_ENABLE: "1"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /condolab-data-zfs/docker/ollama/models:/root/.ollama
    labels:
      - traefik.enable=true
      - traefik.docker.network=ipvlan
      - traefik.http.routers.ollama.rule=Host(`ollama.zinkzone.tech`)
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.middlewares=security-headers@file
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      docker_ipvlan:
        aliases:
          - ollama

networks:
  docker_ipvlan:
    external: true
    name: ipvlan
