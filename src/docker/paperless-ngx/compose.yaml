name: utility-paperless-ngx

services:
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: utility_paperless_ngx_webserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${PAPERLESS_POSTGRES_DB}
      PAPERLESS_DBUSER: ${PAPERLESS_POSTGRES_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_POSTGRES_PASSWORD}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    volumes:
      - ${PAPERLESS_DATA_PATH}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_PATH}:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_PATH}:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME_PATH}:/usr/src/paperless/consume
    labels:
      - traefik.enable=true
      - traefik.docker.network=ipvlan
      - traefik.http.routers.paperless.rule=Host(`paperless.zinkzone.tech`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls=true
      - traefik.http.routers.paperless.middlewares=security-headers@file
      - traefik.http.services.paperless.loadbalancer.server.port=8000
    networks:
      - paperless
      - docker_ipvlan

  db:
    image: postgres:16-alpine
    container_name: utility_paperless_ngx_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_POSTGRES_DB}
      POSTGRES_USER: ${PAPERLESS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_POSTGRES_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=${PAPERLESS_POSTGRES_USER} --dbname=${PAPERLESS_POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      # Keep database files local to the MS-01; NAS mounts are better for documents and backups.
      - ${PAPERLESS_POSTGRES_PATH}:/var/lib/postgresql/data
    networks:
      - paperless

  redis:
    image: redis:8.6.2-alpine
    container_name: utility_paperless_ngx_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - ${PAPERLESS_REDIS_PATH}:/data
    networks:
      - paperless

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: utility_paperless_ngx_gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - paperless

  tika:
    image: apache/tika:latest
    container_name: utility_paperless_ngx_tika
    restart: unless-stopped
    networks:
      - paperless

networks:
  paperless:
    internal: true
  docker_ipvlan:
    external: true
    name: ipvlan
