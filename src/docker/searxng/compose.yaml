name: utility-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: utility_searxng
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_started
    env_file:
      - .env
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
      SEARXNG_VALKEY_URL: redis://valkey:6379/0
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - /condolab/docker/searxng/cache:/var/cache/searxng
    labels:
      - traefik.enable=true
      - traefik.docker.network=ipvlan
      - traefik.http.routers.searxng.rule=Host(`search.zinkzone.tech`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.routers.searxng.middlewares=security-headers@file
      - traefik.http.services.searxng.loadbalancer.server.port=8080
    networks:
      - searxng
      - docker_ipvlan

  valkey:
    image: docker.io/valkey/valkey:9.0.3-alpine
    container_name: utility_searxng_valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - /condolab/docker/searxng/valkey:/data
    networks:
      - searxng

networks:
  searxng:
    internal: true
  docker_ipvlan:
    external: true
    name: ipvlan
