use_default_settings: true

general:
  debug: false
  instance_name: ZinkZone Search

server:
  secret_key: ultrasecretkey #replace on server
  limiter: false
  image_proxy: true

search:
  safe_search: 1
  autocomplete: duckduckgo
  default_lang: auto
  formats:
    - html
    - json
    - rss
ui:
  default_theme: simple
  query_in_title: false
valkey:
  url: redis://valkey:6379/0
engines:
  - name: karmasearch
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true