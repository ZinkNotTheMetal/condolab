use_default_settings: true

general:
  debug: false
  instance_name: ZinkZone Search

server:
  secret_key: ultrasecretkey
  limiter: false
  image_proxy: true

search:
  safe_search: 1
  autocomplete: duckduckgo
  default_lang: auto
  formats:
    - html
    - json
    - rss

ui:
  default_theme: simple
  query_in_title: false

redis:
  url: redis://valkey:6379/0
